version: 0.2

env:
  variables:
    GAME_TYPE: TTT
    ROUNDS: "3"
    GAMES_PER_ROUND: "50"
    EPOCHS: "10"
    BATCH_SIZE: "64"
    MCTS_ITERS: "50"
    MAX_RUNTIME_SECONDS: "3600"
    OUTPUT_DIR: output

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "Installing PyTorch CPU and dependencies..."
      - pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - pip install --quiet -r requirements.txt

  pre_build:
    commands:
      - echo "Run ID ${CODEBUILD_BUILD_ID}"
      - echo "Artifacts bucket ${ARTIFACTS_BUCKET}"
      - export PYTHONPATH="${CODEBUILD_SRC_DIR}:${PYTHONPATH:-}"
      - mkdir -p "${OUTPUT_DIR}/datasets" "${OUTPUT_DIR}/checkpoints"
      - |
        if [ -n "${INITIAL_CHECKPOINT_S3_URI:-}" ]; then
          aws s3 cp "${INITIAL_CHECKPOINT_S3_URI}" initial_checkpoint.pt
          export INITIAL_CHECKPOINT_FLAG="--initial-checkpoint initial_checkpoint.pt"
        else
          export INITIAL_CHECKPOINT_FLAG=""
        fi

  build:
    commands:
      - echo "Starting NNMCTS pipeline (max ${MAX_RUNTIME_SECONDS}s)..."
      - PYTHONPATH="${CODEBUILD_SRC_DIR}:${PYTHONPATH:-}" timeout "${MAX_RUNTIME_SECONDS}" python run_pipeline.py --game-type "${GAME_TYPE}" --rounds "${ROUNDS}" --games-per-round "${GAMES_PER_ROUND}" --output-dir "${OUTPUT_DIR}" --device cpu --player1-type mcts --player2-type mcts --player1-iters "${MCTS_ITERS}" --player2-iters "${MCTS_ITERS}" --epochs "${EPOCHS}" --batch-size "${BATCH_SIZE}" --augment-train --deduplicate-train ${INITIAL_CHECKPOINT_FLAG}

  post_build:
    commands:
      - echo "Uploading artifacts to s3://${ARTIFACTS_BUCKET}/runs/${CODEBUILD_BUILD_ID}/"
      - aws s3 sync "${OUTPUT_DIR}/" "s3://${ARTIFACTS_BUCKET}/runs/${CODEBUILD_BUILD_ID}/output/" --exclude "*.pkl"
      - aws s3 sync "${OUTPUT_DIR}/checkpoints/" "s3://${ARTIFACTS_BUCKET}/runs/${CODEBUILD_BUILD_ID}/checkpoints/"
      - |
        python - <<'PY'
        import json, os, pathlib
        checkpoints = sorted(pathlib.Path(os.environ["OUTPUT_DIR"], "checkpoints").glob("*.pt"))
        manifest = {
          "build_id": os.environ["CODEBUILD_BUILD_ID"],
          "game_type": os.environ["GAME_TYPE"],
          "rounds": int(os.environ["ROUNDS"]),
          "games_per_round": int(os.environ["GAMES_PER_ROUND"]),
          "epochs": int(os.environ["EPOCHS"]),
          "latest_checkpoint": checkpoints[-1].name if checkpoints else None,
          "status": "complete",
        }
        pathlib.Path("manifest.json").write_text(json.dumps(manifest, indent=2))
        PY
      - aws s3 cp manifest.json "s3://${ARTIFACTS_BUCKET}/runs/${CODEBUILD_BUILD_ID}/manifest.json"
      - echo "Pipeline complete. Manifest uploaded."

artifacts:
  files:
    - manifest.json
    - output/checkpoints/**/*
  discard-paths: yes
